{% extends "base.html" %}

{% block announce %}
  <span class="asif-status-dot" aria-hidden="true"></span>
  <strong>ASIF 0.5</strong><span class="asif-banner-divider">/</span> An open format, in progress.
  <a href="{{ 'REFERENCE/' | url }}">Current scope <span aria-hidden="true">↗</span></a>
{% endblock %}

{% block container %}
  <div class="md-content{% if page and page.meta.asif_reference %} asif-reference{% endif %}" data-md-component="content">
    <article class="md-content__inner md-typeset">
      {% block content %}{% include "partials/content.html" %}{% endblock %}
    </article>
  </div>
{% endblock %}
