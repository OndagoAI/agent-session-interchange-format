site_name: ASIF
site_description: Agent Session Interchange Format — a vendor-neutral model for agent sessions.
site_url: https://ondagoai.github.io/agent-session-interchange-format/
repo_url: https://github.com/OndagoAI/agent-session-interchange-format
repo_name: View on GitHub
edit_uri: edit/main/
docs_dir: docs
site_dir: site
strict: true
copyright: ASIF · Open specification · MIT licensed
extra:
  generator: false

theme:
  name: material
  custom_dir: docs/site/overrides
  font: false
  logo: docs/site/assets/mark.svg
  favicon: docs/site/assets/mark.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow

plugins:
  - search
hooks:
  - docs/site/hooks.py
extra_css:
  - docs/site/assets/styles.css
extra_javascript:
  - docs/site/assets/site.js
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - toc:
      permalink: true
validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

nav:
  - Start here:
      - Home: docs/home.md
      - Benefits and use cases: docs/use-cases.md
      - Getting started: docs/getting-started.md
      - Compatibility and evidence: docs/compatibility.md
      - Reference CLIs: REFERENCE.md
  - Specification:
      - Introduction: SPEC.md
      - Session semantics: SEMANTICS.md
      - Profiles: PROFILES.md
      - Portable continuation: CONTINUATION.md
      - Destination snapshots: CAPABILITIES.md
      - Streaming and external bindings: STREAMING.md
      - Package transport: TRANSPORT.md
  - Object reference:
      - Core objects: docs/objects.md
      - Continuation objects: docs/continuation-objects.md
      - Destination reports: docs/report-objects.md
      - JSON schemas: docs/schemas.md
      - Field mapping: docs/field-mapping.md
  - Examples:
      - Sessions and attachments: examples/README.md
      - Continuation scenarios: examples/continuation/README.md
  - Project:
      - Project overview: README.md
      - Contributing: CONTRIBUTING.md
      - Building an adapter: docs/adapters.md
      - Gaps and priorities: GAPS.md
      - Conformance: CONFORMANCE.md
      - Implementation evidence: IMPLEMENTERS.md
      - Governance: GOVERNANCE.md
      - Documentation maintenance: docs/site.md
      - Third-party notices: THIRD-PARTY-NOTICES.md
